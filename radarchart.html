<!DOCTYPE html>
<html lang="en"
<head>
    <meta charset="UTF-8"
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Radar Chart</title>

    </head>
    <body>
        <hi>Radar Chart</hi>
        <divs>
            <canvas id="radarChart"></canvas>
        </divs>
    </body>
    <script>
        class radarChart{
            constructor(canvasid,dataUrl){
                this.canvasid =  canvasid;
                this.dataUrl = dataUrl;
                this.chart = null;

            }

            renderChart(data){
                const ctx = document.getElementById(this.canvasid).getContext("2d");

                this.chart = new Chart(ctx,{
                    type:"radar",
                    data:{
                        //labels
                        labels:data.labels,
                        //datasets
                        datasets:data.datasets

                    },
                    options:{
                        responsive: true,
                        plugins: {
                            legend: {
                                position:"top"
                            },
                            title:{
                                display:true,
                                //title
                                text:"Radar Chart"
                            }

                        
                        },
                        scales:{
                            r:{
                                angleLines:{display:true},
                                suggestedMin:0,
                                suggestedMax:100
                            }
                        }

                    }
                });
            }
        }
    </script>
    </html>
